groups:
  - name: youban-queue-health
    interval: 15s
    rules:
      - alert: YoubanAutoDeleteQueueBacklog
        expr: '{__name__="xiaohuiji.asynq.tasks",queue="youban_publish_auto_delete",state="pending"} > 100'
        for: 2m
        labels:
          severity: WARN
          category: queue
        annotations:
          summary: "自动关键字删除队列积压"
          description: "待删除消息 {{ $value }} 条，已持续 2 分钟，请检查 Worker 消费能力"
      - alert: YoubanAutoDeleteQueueCritical
        expr: '{__name__="xiaohuiji.asynq.tasks",queue="youban_publish_auto_delete",state="pending"} > 1000'
        for: 1m
        labels:
          severity: CRIT
          category: queue
        annotations:
          summary: "自动关键字删除队列严重积压"
          description: "待删除消息 {{ $value }} 条，关键字删除已明显延迟"
      - alert: YoubanAutoDeleteQueueLatencyHigh
        expr: '{__name__="xiaohuiji.asynq.tasks",queue="youban_publish_auto_delete",state="orphan_latency_seconds"} > 120'
        for: 2m
        labels:
          severity: CRIT
          category: queue
        annotations:
          summary: "自动关键字删除延迟超过 2 分钟"
          description: "队列最老任务已等待 {{ $value }} 秒"
      - alert: YoubanAutoDeleteQueueMetricsMissing
        expr: 'absent_over_time({__name__="xiaohuiji.asynq.tasks",queue="youban_publish_auto_delete"}[5m])'
        for: 2m
        labels:
          severity: CRIT
          category: queue
        annotations:
          summary: "自动关键字删除消费者指标消失"
          description: "连续 5 分钟没有自动删除队列指标，Worker 可能未启动或监控链路中断"
      - alert: YoubanApp4BackgroundWorkerHeartbeatMissing
        expr: 'absent_over_time({__name__="xiaohuiji.runtime.heartbeat",service.name="xiaohuiji-worker-app4",scope.name="hotgo/addons/youban_publish",role="background-worker"}[3m])'
        for: 2m
        labels:
          severity: CRIT
          category: runtime
        annotations:
          summary: "应用 4 后台 Worker 心跳消失"
          description: "应用 4 后台 Worker 连续 3 分钟没有心跳，请检查 PostgreSQL、Redis 连接和容器状态"
      - alert: YoubanApp3PublishWorkerHeartbeatMissing
        expr: 'absent_over_time({__name__="xiaohuiji.runtime.heartbeat",service.name="xiaohuiji-publish-worker-app3",scope.name="hotgo/addons/youban_publish",role="push-worker"}[3m])'
        for: 2m
        labels:
          severity: CRIT
          category: runtime
        annotations:
          summary: "应用 3 发布 Worker 心跳消失"
          description: "应用 3 发布 Worker 连续 3 分钟没有心跳，Telegram 推送可能停止"
      - alert: YoubanApp3MediaWorkerHeartbeatMissing
        expr: 'absent_over_time({__name__="xiaohuiji.runtime.heartbeat",service.name="xiaohuiji-media-worker-app3",scope.name="hotgo/addons/youban_publish",role="media-worker"}[3m])'
        for: 2m
        labels:
          severity: CRIT
          category: runtime
        annotations:
          summary: "应用 3 媒体 Worker 心跳消失"
          description: "应用 3 媒体 Worker 连续 3 分钟没有心跳，采集媒体处理可能停止"
      - alert: YoubanCycleSchemaIncomplete
        expr: 'youban_cycle_schema_present_columns < 4'
        for: 1m
        labels:
          severity: CRIT
          category: cycle
        annotations:
          summary: "循环上架数据库迁移不完整"
          description: "循环上架所需 4 个频道字段当前只存在 {{ $value }} 个，请立即执行数据库迁移"
      - alert: YoubanCycleDueBacklog
        expr: 'youban_cycle_backlog_due_jobs > 1000'
        for: 10m
        labels:
          severity: WARN
          category: cycle
        annotations:
          summary: "循环上架任务出现积压"
          description: "当前有 {{ $value }} 条到期循环任务等待处理，已持续 10 分钟"
      - alert: YoubanCycleDueBacklogCritical
        expr: 'youban_cycle_backlog_due_jobs > 5000'
        for: 5m
        labels:
          severity: CRIT
          category: cycle
        annotations:
          summary: "循环上架任务严重积压"
          description: "当前有 {{ $value }} 条到期循环任务等待处理，请检查调度器、数据库迁移和 Worker"
      - alert: YoubanCycleOldestDueHigh
        expr: 'youban_cycle_backlog_oldest_due_age_seconds > 7200'
        for: 10m
        labels:
          severity: CRIT
          category: cycle
        annotations:
          summary: "循环上架延迟超过 2 小时"
          description: "最老循环任务已到期 {{ $value }} 秒，循环调度链路可能中断"
      - alert: YoubanCycleRunsFailed
        expr: 'youban_cycle_runs_failed_runs_15m > 0'
        for: 2m
        labels:
          severity: WARN
          category: cycle
        annotations:
          summary: "循环上架批次执行失败"
          description: "最近 15 分钟有 {{ $value }} 个循环批次失败或部分失败"
      - alert: YoubanCycleMetricsMissing
        expr: 'absent_over_time(youban_cycle_backlog_due_jobs[5m])'
        for: 2m
        labels:
          severity: CRIT
          category: cycle
        annotations:
          summary: "循环上架监控指标消失"
          description: "连续 5 分钟没有循环上架指标，请检查 OTel Collector 与 PostgreSQL 连接"
      - alert: YoubanPublishFailuresHigh
        expr: 'sum(increase({__name__="xiaohuiji.tg.publish_failures"}[10m])) > 10 and sum(increase({__name__="xiaohuiji.tg.publish_failures"}[10m])) <= 30'
        for: 2m
        labels:
          severity: WARN
          category: publish
        annotations:
          summary: "TG 上架失败次数异常"
          description: "最近 10 分钟新增 {{ $value }} 个终态失败任务，请检查 Telegram、媒体和 Worker 状态"
      - alert: YoubanPublishFailuresCritical
        expr: 'sum(increase({__name__="xiaohuiji.tg.publish_failures"}[10m])) > 30'
        for: 1m
        labels:
          severity: CRIT
          category: publish
        annotations:
          summary: "TG 上架失败次数严重异常"
          description: "最近 10 分钟新增 {{ $value }} 个终态失败任务，发布链路可能出现系统性故障"
      - alert: YoubanPublishRecoveryFailures
        expr: 'sum(increase({__name__="xiaohuiji.tg.publish_recoveries",result="failed"}[15m])) > 3'
        for: 2m
        labels:
          severity: WARN
          category: publish
        annotations:
          summary: "TG 上架自动补偿连续失败"
          description: "最近 15 分钟自动补偿失败 {{ $value }} 次，请检查资料维护队列和发布链路"
      - alert: YoubanCollectProcessQueueAmplification
        expr: '{__name__="xiaohuiji.collect.process_queue_amplification_ratio"} > 3 and {__name__="xiaohuiji.collect.process_queue_amplification_ratio"} <= 10'
        for: 5m
        labels:
          severity: WARN
          category: collect
        annotations:
          summary: "采集处理队列出现重复任务放大"
          description: "采集处理任务数是有效分区数的 {{ $value }} 倍，调度去重或唤醒逻辑可能异常"
      - alert: YoubanCollectProcessQueueAmplificationCritical
        expr: '{__name__="xiaohuiji.collect.process_queue_amplification_ratio"} > 10'
        for: 2m
        labels:
          severity: CRIT
          category: collect
        annotations:
          summary: "采集处理队列严重放大"
          description: "采集处理任务数是有效分区数的 {{ $value }} 倍，已可能造成跨租户饥饿"
      - alert: YoubanCollectMediaPendingStale
        expr: '{__name__="xiaohuiji.collect.media_pending_stale_events"} > 0'
        for: 2m
        labels:
          severity: CRIT
          category: collect
        annotations:
          summary: "采集媒体任务超过 10 分钟未完成"
          description: "当前有 {{ $value }} 个 media_pending 事件超过 10 分钟，请检查 Bot API 和媒体 Worker"
      - alert: YoubanCollectMediaPendingTaskMissing
        expr: '{__name__="xiaohuiji.invariant.media_pending_missing_asynq_task"} > 0'
        for: 2m
        labels:
          severity: CRIT
          category: collect
        annotations:
          summary: "采集媒体数据库任务与 Asynq 队列脱节"
          description: "当前有 {{ $value }} 个超时 media_pending 事件没有对应 Asynq 任务，请执行媒体队列恢复"
      - alert: YoubanCollectObserveMetricsUnhealthy
        expr: '{__name__="xiaohuiji.collect.observe_healthy"} == 0 or absent_over_time({__name__="xiaohuiji.collect.observe_healthy"}[3m])'
        for: 2m
        labels:
          severity: CRIT
          category: observability
        annotations:
          summary: "采集队列一致性监控失效"
          description: "采集队列监控查询失败或连续 3 分钟没有上报，不能确认数据库与队列是否一致"
      - alert: YoubanBotApiGetFileErrors
        expr: 'sum(increase({__name__="xiaohuiji.tg.bot_api.get_file_requests",endpoint="local",result="error"}[5m])) > 5'
        for: 1m
        labels:
          severity: CRIT
          category: telegram
        annotations:
          summary: "本地 Telegram Bot API getFile 持续失败"
          description: "最近 5 分钟本地 Bot API getFile 失败 {{ $value }} 次，请检查容器 DNS、端口和服务状态"
      - alert: YoubanBotApiGetFileLatencyHigh
        expr: 'histogram_quantile(0.95, sum by (le) (rate({__name__="xiaohuiji.tg.bot_api.get_file_duration_seconds_bucket",endpoint="local"}[5m]))) > 5'
        for: 3m
        labels:
          severity: WARN
          category: telegram
        annotations:
          summary: "本地 Telegram Bot API getFile 延迟过高"
          description: "本地 Bot API getFile P95 已超过 5 秒，媒体队列吞吐将明显下降"
      - alert: YoubanBotApiFileTransportErrors
        expr: 'sum(increase({__name__="xiaohuiji.tg.bot_api.file_download_requests",endpoint="local",result="error",status_code="transport"}[5m])) > 5'
        for: 1m
        labels:
          severity: CRIT
          category: telegram
        annotations:
          summary: "本地 Telegram Bot API 文件下载网络失败"
          description: "最近 5 分钟本地 Bot API 文件下载发生 {{ $value }} 次网络错误，请检查容器网络和文件服务"
      - alert: YoubanTelegramReconcileStuck
        expr: 'youban_tg_reconcile_oldest_age_seconds > 180'
        for: 2m
        labels:
          severity: CRIT
          category: publish
        annotations:
          summary: "TG 发送结果对账卡住"
          description: "最老待对账任务已等待 {{ $value }} 秒，可能持续占用频道发送槽位"
      - alert: YoubanTelegramReconcileTaskMissing
        expr: 'youban_tg_reconcile_missing_tasks > 0'
        for: 2m
        labels:
          severity: CRIT
          category: publish
        annotations:
          summary: "TG 对账账号任务丢失"
          description: "当前有 {{ $value }} 个仍需处理的 unknown 发布任务没有对应的活动账号对账任务（已终止旧 Job 不计入）"
      - alert: YoubanTelegramReconcileBacklog
        expr: 'youban_tg_reconcile_unknown_jobs > 10'
        for: 5m
        labels:
          severity: WARN
          category: publish
        annotations:
          summary: "TG 发送结果对账出现积压"
          description: "当前有 {{ $value }} 个发送结果不确定任务等待对账，请检查协议号运行状态"
      - alert: YoubanTelegramReconcileExhausted
        expr: 'sum(increase({__name__="xiaohuiji.tg.reconcile_events",result="submission_exhausted"}[10m])) > 0'
        for: 1m
        labels:
          severity: WARN
          category: publish
        annotations:
          summary: "TG 对账已触发有限次数保护"
          description: "最近 10 分钟有 {{ $value }} 个任务对账超限，系统已释放频道并进入自动重试或补偿"
