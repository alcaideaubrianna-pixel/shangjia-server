extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      filesystem: {}
      network: {}
  sqlquery/core:
    driver: postgres
    datasource: ${env:XIAOHUIJI_PG_DSN}
    collection_interval: 15s
    queries:
      - sql: |
          SELECT COALESCE(NULLIF(queue_name, ''), 'youban_publish_tg') AS queue_name,
                 priority,
                 status,
                 dispatch_status,
                 COUNT(*)::bigint AS job_count,
                 COALESCE(EXTRACT(EPOCH FROM (NOW() - MIN(created_at))), 0)::bigint AS oldest_age_seconds
          FROM hg_youban_publish_tg_job
          WHERE status IN ('pending','failed_retry','unknown','sending')
          GROUP BY 1,2,3,4
        metrics:
          - metric_name: xiaohuiji.publish.jobs
            value_column: job_count
            value_type: int
            attribute_columns: [queue_name, priority, status, dispatch_status]
          - metric_name: xiaohuiji.publish.oldest_job_age_seconds
            value_column: oldest_age_seconds
            value_type: int
            attribute_columns: [queue_name, priority, status, dispatch_status]
      - sql: |
          SELECT status, source_type, COUNT(*)::bigint AS event_count,
                 COALESCE(EXTRACT(EPOCH FROM (NOW() - MIN(COALESCE(received_at, created_at)))), 0)::bigint AS oldest_age_seconds
          FROM hg_youban_publish_collect_event
          WHERE processed_at IS NULL AND created_at >= NOW() - INTERVAL '3 days'
          GROUP BY status, source_type
        metrics:
          - metric_name: xiaohuiji.collect.events
            value_column: event_count
            value_type: int
            attribute_columns: [status, source_type]
          - metric_name: xiaohuiji.collect.oldest_event_age_seconds
            value_column: oldest_age_seconds
            value_type: int
            attribute_columns: [status, source_type]
      - sql: |
          SELECT cache_status, media_type, COUNT(*)::bigint AS media_count,
                 COALESCE(EXTRACT(EPOCH FROM (NOW() - MIN(created_at))), 0)::bigint AS oldest_age_seconds
          FROM hg_youban_publish_collect_event_media
          WHERE cache_status <> 'ready' AND created_at >= NOW() - INTERVAL '3 days'
          GROUP BY cache_status, media_type
        metrics:
          - metric_name: xiaohuiji.collect.media
            value_column: media_count
            value_type: int
            attribute_columns: [cache_status, media_type]
          - metric_name: xiaohuiji.collect.oldest_media_age_seconds
            value_column: oldest_age_seconds
            value_type: int
            attribute_columns: [cache_status, media_type]
      - sql: |
          SELECT status, COUNT(*)::bigint AS account_count
          FROM hg_youban_publish_tg_account
          WHERE deleted_at IS NULL
          GROUP BY status
        metrics:
          - metric_name: xiaohuiji.tg.accounts
            value_column: account_count
            value_type: int
            attribute_columns: [status]
      - sql: |
          SELECT COUNT(*)::bigint AS violation_count
          FROM (
            SELECT channel_id
            FROM hg_youban_publish_tg_job
            WHERE status = 'sending' OR dispatch_status = 'processing'
            GROUP BY channel_id
            HAVING COUNT(*) > 1
          ) violations
        metrics:
          - metric_name: xiaohuiji.invariant.channel_multiple_active_jobs
            value_column: violation_count
            value_type: int
      - sql: |
          SELECT COUNT(*)::bigint AS violation_count
          FROM hg_youban_publish_tg_job
          WHERE status = 'sending' AND updated_at < NOW() - INTERVAL '12 minutes'
        metrics:
          - metric_name: xiaohuiji.invariant.stale_sending_jobs
            value_column: violation_count
            value_type: int
      - sql: |
          SELECT COUNT(*)::bigint AS violation_count
          FROM (
            SELECT channel_id
            FROM hg_youban_publish_tg_job j
            WHERE j.status IN ('pending','failed_retry','unknown')
              AND COALESCE(j.dispatch_status, '') IN ('', 'idle')
              AND j.updated_at < NOW() - INTERVAL '2 minutes'
              AND NOT EXISTS (
                SELECT 1 FROM hg_youban_publish_tg_job active
                WHERE active.channel_id = j.channel_id
                  AND (active.status = 'sending' OR active.dispatch_status IN ('queued','processing'))
              )
            GROUP BY channel_id
          ) violations
        metrics:
          - metric_name: xiaohuiji.invariant.idle_channel_without_active_head
            value_column: violation_count
            value_type: int
      - sql: |
          SELECT COUNT(*)::bigint AS invalid_count
          FROM hg_youban_publish_collect_event
          WHERE bot_id = 0 AND source_type = 'bot' AND created_at >= NOW() - INTERVAL '1 hour'
        metrics:
          - metric_name: xiaohuiji.invariant.collect_bot_id_zero
            value_column: invalid_count
            value_type: int
      - sql: |
          SELECT source_type, COUNT(*)::bigint AS stale_source_count
          FROM hg_youban_publish_collect_source
          WHERE collect_enabled = 1 AND status = 1 AND deleted_at IS NULL
            AND COALESCE(last_event_at, created_at) < NOW() - INTERVAL '1 hour'
          GROUP BY source_type
        metrics:
          - metric_name: xiaohuiji.collect.configured_sources_without_events
            value_column: stale_source_count
            value_type: int
            attribute_columns: [source_type]
      - sql: |
          WITH pending AS (
            SELECT channel_id, COUNT(*)::bigint AS pending_count,
                   MIN(created_at) AS oldest_at
            FROM hg_youban_publish_tg_job
            WHERE status IN ('pending','failed_retry','unknown')
              AND COALESCE(dispatch_status, '') IN ('', 'idle','queued','processing')
            GROUP BY channel_id
          ), sent AS (
            SELECT channel_id, COUNT(*)::numeric / 10.0 AS sent_per_minute
            FROM hg_youban_publish_tg_job
            WHERE status = 'sent' AND sent_at >= NOW() - INTERVAL '10 minutes'
            GROUP BY channel_id
          )
          SELECT pending.channel_id::text AS channel_id,
                 COALESCE(NULLIF(c.channel_title, ''), '频道 ' || pending.channel_id::text) || ' (' || pending.channel_id::text || ')' AS channel,
                 pending.pending_count,
                 COALESCE(EXTRACT(EPOCH FROM (NOW() - pending.oldest_at)), 0)::bigint AS oldest_age_seconds,
                 COALESCE(CEIL(pending.pending_count / NULLIF(sent.sent_per_minute, 0)), -1)::bigint AS estimated_clear_minutes
          FROM pending
          LEFT JOIN sent USING (channel_id)
          LEFT JOIN hg_youban_publish_channel c ON c.id = pending.channel_id AND c.deleted_at IS NULL
          ORDER BY pending.pending_count DESC
          LIMIT 20
        metrics:
          - metric_name: xiaohuiji.publish.channel_pending
            value_column: pending_count
            value_type: int
            attribute_columns: [channel_id, channel]
          - metric_name: xiaohuiji.publish.channel_oldest_age_seconds
            value_column: oldest_age_seconds
            value_type: int
            attribute_columns: [channel_id, channel]
          - metric_name: xiaohuiji.publish.channel_estimated_clear_minutes
            value_column: estimated_clear_minutes
            value_type: int
            attribute_columns: [channel_id, channel]
      - sql: |
          SELECT COUNT(*)::bigint AS error_count
          FROM hg_youban_publish_collect_event_media
          WHERE error_message ILIKE '%FILE_REFERENCE_EXPIRED%'
            AND updated_at >= NOW() - INTERVAL '15 minutes'
        metrics:
          - metric_name: xiaohuiji.tg.file_reference_expired
            value_column: error_count
            value_type: int
      - sql: |
          SELECT COUNT(*)::bigint AS missing_preview_count
          FROM hg_youban_publish_collect_event_media
          WHERE media_type = 'video' AND cache_status = 'ready'
            AND COALESCE(poster_url, '') = ''
            AND updated_at >= NOW() - INTERVAL '1 hour'
        metrics:
          - metric_name: xiaohuiji.collect.video_preview_missing
            value_column: missing_preview_count
            value_type: int
      - sql: |
          SELECT processing_status, COUNT(*)::bigint AS media_count,
                 COALESCE(EXTRACT(EPOCH FROM (NOW() - MIN(updated_at))), 0)::bigint AS oldest_age_seconds
          FROM hg_youban_publish_media
          WHERE deleted_at IS NULL
            AND processing_status IN ('uploaded','processing','failed')
          GROUP BY processing_status
        metrics:
          - metric_name: xiaohuiji.media.phash_queue
            value_column: media_count
            value_type: int
            attribute_columns: [processing_status]
          - metric_name: xiaohuiji.media.phash_oldest_age_seconds
            value_column: oldest_age_seconds
            value_type: int
            attribute_columns: [processing_status]
      - sql: |
          SELECT CASE
                   WHEN UPPER(COALESCE(error_message, '')) LIKE '%SLOWMODE_WAIT%'
                     OR UPPER(COALESCE(error_message, '')) LIKE '%FLOOD_WAIT%'
                     OR UPPER(COALESCE(error_message, '')) LIKE '%TOO MANY REQUESTS%' THEN 'rate_limit'
                   WHEN UPPER(COALESCE(error_message, '')) LIKE '%TIMEOUT%'
                     OR UPPER(COALESCE(error_message, '')) LIKE '%DEADLINE%'
                     OR UPPER(COALESCE(error_message, '')) LIKE '%CONTEXT CANCELED%' THEN 'timeout'
                   WHEN UPPER(COALESCE(error_message, '')) LIKE '%AUTH%'
                     OR UPPER(COALESCE(error_message, '')) LIKE '%SESSION%'
                     OR UPPER(COALESCE(error_message, '')) LIKE '%UNAUTHORIZED%' THEN 'authorization'
                   WHEN UPPER(COALESCE(error_message, '')) LIKE '%PERMISSION%'
                     OR UPPER(COALESCE(error_message, '')) LIKE '%CHAT_ADMIN_REQUIRED%'
                     OR UPPER(COALESCE(error_message, '')) LIKE '%FORBIDDEN%' THEN 'permission'
                   WHEN UPPER(COALESCE(error_message, '')) LIKE '%FILE%'
                     OR UPPER(COALESCE(error_message, '')) LIKE '%MEDIA%'
                     OR UPPER(COALESCE(error_message, '')) LIKE '%IMAGE_PROCESS_FAILED%' THEN 'media'
                   ELSE 'other'
                 END AS error_type,
                 COUNT(*)::bigint AS error_count
          FROM hg_youban_publish_tg_job
          WHERE status IN ('failed','failed_retry')
            AND COALESCE(updated_at, created_at) >= NOW() - INTERVAL '15 minutes'
          GROUP BY 1
        metrics:
          - metric_name: xiaohuiji.publish.errors
            value_column: error_count
            value_type: int
            attribute_columns: [error_type]
      - sql: |
          SELECT CASE
                   WHEN sent_at IS NULL OR dispatched_at IS NULL THEN 'unknown'
                   WHEN EXTRACT(EPOCH FROM (sent_at - dispatched_at)) < 5 THEN '<5s'
                   WHEN EXTRACT(EPOCH FROM (sent_at - dispatched_at)) < 30 THEN '5-30s'
                   WHEN EXTRACT(EPOCH FROM (sent_at - dispatched_at)) < 120 THEN '30-120s'
                   ELSE '>=120s'
                 END AS latency_bucket,
                 COUNT(*)::bigint AS send_count,
                 COALESCE(AVG(GREATEST(EXTRACT(EPOCH FROM (sent_at - dispatched_at)), 0)), 0)::bigint AS average_seconds
          FROM hg_youban_publish_tg_job
          WHERE status = 'sent'
            AND sent_at >= NOW() - INTERVAL '15 minutes'
            AND dispatched_at IS NOT NULL
          GROUP BY 1
        metrics:
          - metric_name: xiaohuiji.publish.send_latency_count
            value_column: send_count
            value_type: int
            attribute_columns: [latency_bucket]
          - metric_name: xiaohuiji.publish.send_latency_average_seconds
            value_column: average_seconds
            value_type: int
            attribute_columns: [latency_bucket]
      - sql: |
          SELECT j.channel_id::text AS channel_id,
                 COALESCE(NULLIF(MAX(c.channel_title), ''), '频道 ' || j.channel_id::text) || ' (' || j.channel_id::text || ')' AS channel,
                 COUNT(*) FILTER (WHERE retry_count > 0)::bigint AS retry_jobs,
                 COALESCE(SUM(retry_count), 0)::bigint AS retry_count,
                 COALESCE(MAX(retry_count), 0)::bigint AS max_retry_count
          FROM hg_youban_publish_tg_job j
          LEFT JOIN hg_youban_publish_channel c ON c.id = j.channel_id AND c.deleted_at IS NULL
          WHERE retry_count > 0
            AND COALESCE(j.updated_at, j.created_at) >= NOW() - INTERVAL '1 hour'
          GROUP BY j.channel_id
          ORDER BY retry_count DESC
          LIMIT 20
        metrics:
          - metric_name: xiaohuiji.publish.channel_retries
            value_column: retry_count
            value_type: int
            attribute_columns: [channel_id, channel]
          - metric_name: xiaohuiji.publish.channel_retry_jobs
            value_column: retry_jobs
            value_type: int
            attribute_columns: [channel_id, channel]
          - metric_name: xiaohuiji.publish.channel_max_retry_count
            value_column: max_retry_count
            value_type: int
            attribute_columns: [channel_id, channel]
      - sql: |
          SELECT j.bot_id::text AS bot_id,
                 COALESCE(NULLIF(MAX(b.bot_name), ''), NULLIF(MAX(b.bot_username), ''), 'Bot ' || j.bot_id::text) AS bot,
                 COUNT(*)::bigint AS message_count
          FROM hg_youban_publish_tg_job j
          LEFT JOIN hg_youban_publish_bot b ON b.id = j.bot_id AND b.deleted_at IS NULL
          WHERE j.status = 'sent' AND j.sent_at >= NOW() - INTERVAL '1 hour' AND j.bot_id > 0
          GROUP BY j.bot_id
          ORDER BY message_count DESC
          LIMIT 20
        metrics:
          - metric_name: xiaohuiji.publish.bot_messages_1h
            value_column: message_count
            value_type: int
            attribute_columns: [bot_id, bot]
      - sql: |
          SELECT e.bot_id::text AS bot_id,
                 COALESCE(NULLIF(MAX(b.bot_name), ''), NULLIF(MAX(b.bot_username), ''), 'Bot ' || e.bot_id::text) AS bot,
                 COUNT(*)::bigint AS collect_count
          FROM hg_youban_publish_collect_event e
          LEFT JOIN hg_youban_publish_bot b ON b.id = e.bot_id AND b.deleted_at IS NULL
          WHERE e.source_type = 'bot' AND e.created_at >= NOW() - INTERVAL '1 hour' AND e.bot_id > 0
          GROUP BY e.bot_id
          ORDER BY collect_count DESC
          LIMIT 20
        metrics:
          - metric_name: xiaohuiji.collect.bot_messages_1h
            value_column: collect_count
            value_type: int
            attribute_columns: [bot_id, bot]
      - sql: |
          SELECT e.tg_account_id::text AS tg_account_id,
                 COALESCE(NULLIF(MAX(ta.display_name), ''), NULLIF(MAX(ta.telegram_username), ''), '协议账号 ' || e.tg_account_id::text) AS tg_account,
                 COUNT(*)::bigint AS collect_count,
                 (COUNT(*)::numeric / 60.0)::double precision AS messages_per_minute
          FROM hg_youban_publish_collect_event e
          LEFT JOIN hg_youban_publish_tg_account ta ON ta.id = e.tg_account_id AND ta.deleted_at IS NULL
          WHERE e.source_type = 'account' AND e.created_at >= NOW() - INTERVAL '1 hour' AND e.tg_account_id > 0
          GROUP BY e.tg_account_id
          ORDER BY collect_count DESC
          LIMIT 20
        metrics:
          - metric_name: xiaohuiji.collect.account_messages_1h
            value_column: collect_count
            value_type: int
            attribute_columns: [tg_account_id, tg_account]
          - metric_name: xiaohuiji.collect.account_messages_per_minute
            value_column: messages_per_minute
            value_type: double
            attribute_columns: [tg_account_id, tg_account]
      - sql: |
          SELECT j.account_id::text AS account_id,
                 COALESCE(NULLIF(MAX(a.nickname), ''), NULLIF(MAX(a.username), ''), '业务账号 ' || j.account_id::text) AS account,
                 COUNT(*)::bigint AS publish_count,
                 COALESCE(AVG(GREATEST(EXTRACT(EPOCH FROM (j.sent_at - j.created_at)), 0)), 0)::double precision AS average_seconds
          FROM hg_youban_publish_tg_job j
          LEFT JOIN hg_youban_publish_account a ON a.id = j.account_id AND a.deleted_at IS NULL
          WHERE j.status = 'sent' AND j.sent_at >= NOW() - INTERVAL '1 hour' AND j.account_id > 0
          GROUP BY j.account_id
          ORDER BY average_seconds DESC
          LIMIT 20
        metrics:
          - metric_name: xiaohuiji.publish.account_messages_1h
            value_column: publish_count
            value_type: int
            attribute_columns: [account_id, account]
          - metric_name: xiaohuiji.publish.account_average_seconds
            value_column: average_seconds
            value_type: double
            attribute_columns: [account_id, account]
      - sql: |
          SELECT COALESCE(NULLIF(media_type, ''), 'unknown') AS media_type,
                 COUNT(*)::bigint AS download_count,
                 COALESCE(SUM(download_bytes), 0)::bigint AS download_bytes,
                 COALESCE(AVG(download_duration_ms), 0)::double precision AS average_duration_ms,
                 COALESCE(SUM(download_bytes)::double precision / NULLIF(SUM(download_duration_ms), 0) / 125.0, 0) AS throughput_mbps
          FROM hg_youban_publish_collect_event_media
          WHERE cache_status = 'ready' AND updated_at >= NOW() - INTERVAL '15 minutes'
          GROUP BY media_type
        metrics:
          - metric_name: xiaohuiji.collect.media_download_count_15m
            value_column: download_count
            value_type: int
            attribute_columns: [media_type]
          - metric_name: xiaohuiji.collect.media_download_bytes_15m
            value_column: download_bytes
            value_type: int
            attribute_columns: [media_type]
          - metric_name: xiaohuiji.collect.media_download_average_ms
            value_column: average_duration_ms
            value_type: double
            attribute_columns: [media_type]
          - metric_name: xiaohuiji.collect.media_download_throughput_mbps
            value_column: throughput_mbps
            value_type: double
            attribute_columns: [media_type]
      - sql: |
          SELECT CASE
                   WHEN UPPER(COALESCE(error_message, '')) LIKE '%TIMEOUT%'
                     OR UPPER(COALESCE(error_message, '')) LIKE '%DEADLINE%'
                     OR UPPER(COALESCE(error_message, '')) LIKE '%CONTEXT CANCELED%' THEN 'timeout'
                   WHEN UPPER(COALESCE(error_message, '')) LIKE '%FILE_REFERENCE_EXPIRED%' THEN 'file_reference_expired'
                   WHEN UPPER(COALESCE(error_message, '')) LIKE '%FLOOD_WAIT%'
                     OR UPPER(COALESCE(error_message, '')) LIKE '%TOO MANY REQUESTS%' THEN 'rate_limit'
                   ELSE 'other'
                 END AS error_type,
                 media_type,
                 COUNT(*)::bigint AS error_count
          FROM hg_youban_publish_collect_event_media
          WHERE cache_status = 'failed'
            AND updated_at >= NOW() - INTERVAL '15 minutes'
          GROUP BY 1, 2
        metrics:
          - metric_name: xiaohuiji.collect.media_errors
            value_column: error_count
            value_type: int
            attribute_columns: [error_type, media_type]
      - sql: |
          SELECT checkpoints_timed::bigint AS checkpoints_timed,
                 checkpoints_req::bigint AS checkpoints_requested,
                 checkpoint_write_time::double precision AS checkpoint_write_time_ms,
                 checkpoint_sync_time::double precision AS checkpoint_sync_time_ms,
                 buffers_checkpoint::bigint AS buffers_checkpoint,
                 buffers_backend::bigint AS buffers_backend,
                 maxwritten_clean::bigint AS maxwritten_clean
          FROM pg_stat_bgwriter
        metrics:
          - metric_name: xiaohuiji.postgres.checkpoints_timed_total
            value_column: checkpoints_timed
            value_type: int
          - metric_name: xiaohuiji.postgres.checkpoints_requested_total
            value_column: checkpoints_requested
            value_type: int
          - metric_name: xiaohuiji.postgres.checkpoint_write_time_ms_total
            value_column: checkpoint_write_time_ms
            value_type: double
          - metric_name: xiaohuiji.postgres.checkpoint_sync_time_ms_total
            value_column: checkpoint_sync_time_ms
            value_type: double
          - metric_name: xiaohuiji.postgres.buffers_checkpoint_total
            value_column: buffers_checkpoint
            value_type: int
          - metric_name: xiaohuiji.postgres.buffers_backend_total
            value_column: buffers_backend
            value_type: int
          - metric_name: xiaohuiji.postgres.maxwritten_clean_total
            value_column: maxwritten_clean
            value_type: int
      - sql: |
          SELECT wal_records::bigint AS wal_records,
                 wal_fpi::bigint AS wal_fpi,
                 wal_bytes::double precision AS wal_bytes
          FROM pg_stat_wal
        metrics:
          - metric_name: xiaohuiji.postgres.wal_records_total
            value_column: wal_records
            value_type: int
          - metric_name: xiaohuiji.postgres.wal_fpi_total
            value_column: wal_fpi
            value_type: int
          - metric_name: xiaohuiji.postgres.wal_bytes_total
            value_column: wal_bytes
            value_type: double
      - sql: |
          SELECT datname,
                 xact_commit::bigint AS commits,
                 xact_rollback::bigint AS rollbacks,
                 blks_read::bigint AS blocks_read,
                 blks_hit::bigint AS blocks_hit,
                 temp_files::bigint AS temp_files,
                 temp_bytes::double precision AS temp_bytes,
                 deadlocks::bigint AS deadlocks
          FROM pg_stat_database
          WHERE datname = current_database()
        metrics:
          - metric_name: xiaohuiji.postgres.commits_total
            value_column: commits
            value_type: int
            attribute_columns: [datname]
          - metric_name: xiaohuiji.postgres.rollbacks_total
            value_column: rollbacks
            value_type: int
            attribute_columns: [datname]
          - metric_name: xiaohuiji.postgres.blocks_read_total
            value_column: blocks_read
            value_type: int
            attribute_columns: [datname]
          - metric_name: xiaohuiji.postgres.blocks_hit_total
            value_column: blocks_hit
            value_type: int
            attribute_columns: [datname]
          - metric_name: xiaohuiji.postgres.temp_files_total
            value_column: temp_files
            value_type: int
            attribute_columns: [datname]
          - metric_name: xiaohuiji.postgres.temp_bytes_total
            value_column: temp_bytes
            value_type: double
            attribute_columns: [datname]
          - metric_name: xiaohuiji.postgres.deadlocks_total
            value_column: deadlocks
            value_type: int
            attribute_columns: [datname]
      - sql: |
          SELECT relname,
                 n_tup_ins::bigint AS inserts,
                 n_tup_upd::bigint AS updates,
                 n_tup_del::bigint AS deletes,
                 n_dead_tup::bigint AS dead_tuples,
                 seq_scan::bigint AS sequential_scans,
                 idx_scan::bigint AS index_scans
          FROM pg_stat_user_tables
          WHERE n_tup_ins + n_tup_upd + n_tup_del > 0
          ORDER BY n_tup_upd + n_tup_ins + n_tup_del DESC
          LIMIT 50
        metrics:
          - metric_name: xiaohuiji.postgres.table_inserts_total
            value_column: inserts
            value_type: int
            attribute_columns: [relname]
          - metric_name: xiaohuiji.postgres.table_updates_total
            value_column: updates
            value_type: int
            attribute_columns: [relname]
          - metric_name: xiaohuiji.postgres.table_deletes_total
            value_column: deletes
            value_type: int
            attribute_columns: [relname]
          - metric_name: xiaohuiji.postgres.table_dead_tuples
            value_column: dead_tuples
            value_type: int
            attribute_columns: [relname]
          - metric_name: xiaohuiji.postgres.table_sequential_scans_total
            value_column: sequential_scans
            value_type: int
            attribute_columns: [relname]
          - metric_name: xiaohuiji.postgres.table_index_scans_total
            value_column: index_scans
            value_type: int
            attribute_columns: [relname]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  resource:
    attributes:
      - key: deployment.environment.name
        value: production
        action: upsert
      - key: telemetry.platform
        value: railway
        action: upsert
  batch:
    timeout: 5s
    send_batch_size: 1024
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 200
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 2000
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 15

exporters:
  otlphttp/openobserve:
    endpoint: ${env:OPENOBSERVE_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:OPENOBSERVE_AUTHORIZATION}
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 10000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, tail_sampling, batch]
      exporters: [otlphttp/openobserve]
    metrics:
      receivers: [otlp, hostmetrics, sqlquery/core]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/openobserve]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/openobserve]

  telemetry:
    logs:
      level: info
