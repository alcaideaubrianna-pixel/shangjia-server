receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128
  resource/tencent:
    attributes:
    - key: token
      value: ${env:APM_TOKEN}
      action: upsert
  batch:
    send_batch_size: 512
    timeout: 5s
  attributes/victoriatraces:
    actions:
    - key: db.statement
      action: delete
    - key: db.query.text
      action: delete
    - key: db.query.parameter
      action: delete
    - key: url.full
      action: delete
    - key: url.query
      action: delete
    - key: http.url
      action: delete
    - key: http.target
      action: delete
    - key: http.request.header.authorization
      action: delete
    - key: http.request.header.cookie
      action: delete
    - key: authorization
      action: delete
    - key: cookie
      action: delete
exporters:
  otlphttp/cls:
    logs_endpoint: https://ap-singapore.cls.tencentyun.com/v1/logs
    headers:
      Authorization: "Basic ${env:CLS_OTEL_AUTH}"
      topic_id: "78dbfc24-a063-4a29-b758-ac9ad5fd7cac"
    compression: gzip
  otlphttp/victorialogs:
    logs_endpoint: http://10.3.0.4:19428/insert/opentelemetry/v1/logs
    timeout: 8s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 32
  prometheusremotewrite/victoriametrics:
    endpoint: http://127.0.0.1:8428/api/v1/write
    remote_write_queue:
      enabled: true
      queue_size: 2000
      num_consumers: 2
  debug:
    verbosity: basic
  otlphttp/victoriatraces:
    traces_endpoint: http://127.0.0.1:10428/insert/opentelemetry/v1/traces
    timeout: 8s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 32
service:
  pipelines:
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/tencent
      - batch
      exporters:
      - prometheusremotewrite/victoriametrics
    logs:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/tencent
      - batch
      exporters:
      - otlphttp/cls
      - otlphttp/victorialogs
    traces/victoria:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - attributes/victoriatraces
      - batch
      exporters:
      - otlphttp/victoriatraces
