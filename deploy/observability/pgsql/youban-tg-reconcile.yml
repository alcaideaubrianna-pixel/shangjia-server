youban_tg_reconcile:
  name: youban_tg_reconcile
  desc: Telegram ambiguous delivery reconciliation health
  predicate_queries:
    - name: tg job table exists
      predicate_query: |
        SELECT to_regclass('public.hg_youban_publish_tg_job') IS NOT NULL;
  query: |-
    SELECT current_database() AS datname,
           COUNT(*)::bigint AS unknown_jobs,
           COALESCE(EXTRACT(EPOCH FROM (
             NOW() - MIN(COALESCE(j.next_retry_at, j.updated_at)) FILTER (
               WHERE j.dispatch_status = 'idle'
                 AND COALESCE(j.next_retry_at, j.updated_at) <= NOW()
             )
           )), 0)::bigint AS oldest_age_seconds,
           COUNT(*) FILTER (
             WHERE j.dispatch_status = 'idle'
               AND COALESCE(j.next_retry_at, j.updated_at) <= NOW()
               AND NOT EXISTS (
                 SELECT 1
                 FROM hg_tg_collector_account_task t
                 WHERE t.tenant_id = j.tenant_id
                   AND t.task_key = 'message-reconcile:' || j.id::text
                   AND t.task_type = 'message_reconcile'
                   AND t.status IN ('pending','processing','failed_retry')
               )
           )::bigint AS missing_tasks
    FROM hg_youban_publish_tg_job j
    WHERE j.status = 'unknown'
      AND j.dispatch_status <> 'done'
  ttl: 30
  timeout: 2
  tags: [ "dbname:railway" ]
  metrics:
    - datname: { usage: LABEL, description: database name }
    - unknown_jobs: { usage: GAUGE, description: actionable ambiguous Telegram delivery jobs awaiting reconciliation }
    - oldest_age_seconds: { usage: GAUGE, description: oldest ambiguous Telegram delivery job age }
    - missing_tasks: { usage: GAUGE, description: actionable ambiguous jobs without an active account reconciliation task }
