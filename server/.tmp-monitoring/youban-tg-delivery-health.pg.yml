youban_tg_delivery_health:
  name: youban_tg_delivery_health
  desc: Telegram publishing delivery health based on bounded active job sets
  predicate_queries:
    - name: tg job table exists
      predicate_query: |
        SELECT to_regclass('public.hg_youban_publish_tg_job') IS NOT NULL;
  query: |-
    SELECT current_database() AS datname,
           COUNT(*) FILTER (WHERE updated_at < NOW() - INTERVAL '1 minute')::bigint AS partial_jobs_warning,
           COUNT(*) FILTER (WHERE updated_at < NOW() - INTERVAL '3 minutes')::bigint AS partial_jobs,
           COALESCE(EXTRACT(EPOCH FROM (NOW() - MIN(updated_at))), 0)::bigint AS oldest_partial_age_seconds
    FROM hg_youban_publish_tg_job
    WHERE status IN ('sending','unknown')
      AND operation_no NOT LIKE 'message_push:%'
      AND operation_no NOT LIKE 'message_push_plan:%'
      AND send_phase IN ('display_confirmed','verify_sending')
      AND updated_at < NOW() - INTERVAL '1 minute'
  ttl: 30
  timeout: 2
  tags: [ "dbname:railway" ]
  metrics:
    - datname: { usage: LABEL, description: database name }
    - partial_jobs_warning: { usage: GAUGE, description: jobs with display delivery but verification phase incomplete for over one minute }
    - partial_jobs: { usage: GAUGE, description: jobs with display delivery but verification phase incomplete for over three minutes }
    - oldest_partial_age_seconds: { usage: GAUGE, description: oldest incomplete verification delivery age }

youban_tg_due_health:
  name: youban_tg_due_health
  desc: Due Telegram jobs and channels without an active sender
  predicate_queries:
    - name: tg job table exists
      predicate_query: |
        SELECT to_regclass('public.hg_youban_publish_tg_job') IS NOT NULL;
  query: |-
    WITH due_channel AS MATERIALIZED (
      SELECT tenant_id, channel_id, target_chat_id,
             COUNT(*)::bigint AS due_jobs,
             MIN(COALESCE(next_retry_at, created_at)) AS oldest_due_at
      FROM hg_youban_publish_tg_job
      WHERE status IN ('pending','failed_retry')
        AND dispatch_status IN ('idle','queued')
        AND COALESCE(next_retry_at, created_at) <= NOW()
      GROUP BY tenant_id, channel_id, target_chat_id
    ), active_channel AS MATERIALIZED (
      SELECT DISTINCT tenant_id, channel_id
      FROM hg_youban_publish_tg_job
      WHERE status IN ('sending','unknown')
         OR (status IN ('pending','failed_retry') AND dispatch_status IN ('queued','processing'))
         OR (status = 'failed_retry'
             AND last_dispatch_error ILIKE ANY (ARRAY[
               '%FLOOD_WAIT%',
               '%发送频率过快%',
               '%触发限流%'
             ])
             AND (COALESCE(next_retry_at, NOW()) > NOW()
                  OR updated_at > NOW() - INTERVAL '5 minutes'))
    ), recent_progress AS MATERIALIZED (
      SELECT tenant_id, channel_id, MAX(sent_at) AS last_sent_at
      FROM hg_youban_publish_tg_job
      WHERE sent_at > NOW() - INTERVAL '1 hour'
      GROUP BY tenant_id, channel_id
    ), stalled AS MATERIALIZED (
      SELECT d.*
      FROM due_channel d
      LEFT JOIN active_channel a USING (tenant_id, channel_id)
      LEFT JOIN recent_progress p USING (tenant_id, channel_id)
      WHERE a.channel_id IS NULL
        AND (p.last_sent_at IS NULL OR p.last_sent_at < NOW() - INTERVAL '5 minutes')
    )
    SELECT current_database() AS datname,
           COALESCE((SELECT SUM(due_jobs) FROM due_channel), 0)::bigint AS due_jobs,
           COALESCE(EXTRACT(EPOCH FROM (NOW() - (SELECT MIN(oldest_due_at) FROM due_channel))), 0)::bigint AS oldest_due_age_seconds,
           COALESCE((SELECT COUNT(*) FROM stalled), 0)::bigint AS due_without_active,
           COALESCE(EXTRACT(EPOCH FROM (NOW() - (SELECT MIN(oldest_due_at) FROM stalled))), 0)::bigint AS oldest_without_active_age_seconds
  ttl: 30
  timeout: 2
  tags: [ "dbname:railway" ]
  metrics:
    - datname: { usage: LABEL, description: database name }
    - due_jobs: { usage: GAUGE, description: due Telegram publishing jobs }
    - oldest_due_age_seconds: { usage: GAUGE, description: oldest due Telegram publishing job age }
    - due_without_active: { usage: GAUGE, description: due jobs whose target channel has no active sender }
    - oldest_without_active_age_seconds: { usage: GAUGE, description: age of the oldest due channel with no active sender and no progress for five minutes }

youban_tg_backlog_health:
  name: youban_tg_backlog_health
  desc: Global Telegram publishing backlog, active lanes and drain rate
  predicate_queries:
    - name: tg job table exists
      predicate_query: |
        SELECT to_regclass('public.hg_youban_publish_tg_job') IS NOT NULL;
  query: |-
    WITH jobs AS MATERIALIZED (
      SELECT tenant_id,channel_id,status,dispatch_status,next_retry_at,created_at,sent_at
      FROM hg_youban_publish_tg_job
      WHERE status IN ('pending','failed_retry','sending','unknown','sent')
        AND operation_no NOT LIKE 'message_push:%'
        AND operation_no NOT LIKE 'message_push_plan:%'
    ), aggregate AS (
      SELECT
        COUNT(*) FILTER (WHERE status IN ('pending','failed_retry') AND dispatch_status IN ('idle','queued') AND COALESCE(next_retry_at,created_at) <= NOW())::bigint AS due_jobs,
        COUNT(*) FILTER (WHERE status IN ('sending','unknown') OR (status IN ('pending','failed_retry') AND dispatch_status IN ('queued','processing')))::bigint AS active_jobs,
        COUNT(DISTINCT (tenant_id,channel_id)) FILTER (WHERE status IN ('sending','unknown') OR (status IN ('pending','failed_retry') AND dispatch_status IN ('queued','processing')))::bigint AS active_channels,
        COALESCE(EXTRACT(EPOCH FROM (NOW() - MIN(COALESCE(next_retry_at,created_at))) FILTER (WHERE status IN ('pending','failed_retry') AND dispatch_status IN ('idle','queued') AND COALESCE(next_retry_at,created_at) <= NOW())),0)::bigint AS oldest_due_age_seconds,
        COUNT(*) FILTER (WHERE status='sent' AND sent_at >= NOW()-INTERVAL '10 minutes')::bigint AS sent_10m
      FROM jobs
    )
    SELECT current_database() AS datname, due_jobs, active_jobs, active_channels, oldest_due_age_seconds, sent_10m,
           CASE WHEN sent_10m > 0 THEN (due_jobs * 600 / sent_10m)::bigint ELSE 0 END AS estimated_drain_seconds
    FROM aggregate
  ttl: 30
  timeout: 2
  tags: [ "dbname:railway" ]
  metrics:
    - datname: { usage: LABEL, description: database name }
    - due_jobs: { usage: GAUGE, description: globally due Telegram publishing jobs }
    - active_jobs: { usage: GAUGE, description: globally active Telegram publishing jobs }
    - active_channels: { usage: GAUGE, description: channels with an active Telegram publishing lane }
    - oldest_due_age_seconds: { usage: GAUGE, description: age of the oldest globally due job }
    - sent_10m: { usage: GAUGE, description: successful Telegram jobs in the last ten minutes }
    - estimated_drain_seconds: { usage: GAUGE, description: estimated seconds to drain current backlog at the recent global rate }

youban_tg_dispatch_health:
  name: youban_tg_dispatch_health
  desc: Telegram dispatcher loops and stale processing jobs
  predicate_queries:
    - name: tg job table exists
      predicate_query: |
        SELECT to_regclass('public.hg_youban_publish_tg_job') IS NOT NULL;
  query: |-
    SELECT current_database() AS datname,
           COUNT(*) FILTER (WHERE dispatch_count > 10)::bigint AS loop_jobs,
           COALESCE(MAX(dispatch_count), 0)::bigint AS max_dispatch_count,
           COUNT(*) FILTER (WHERE status IN ('sending','unknown') AND updated_at < NOW() - INTERVAL '8 minutes')::bigint AS stuck_jobs
    FROM hg_youban_publish_tg_job
    WHERE status IN ('pending','failed_retry','sending','unknown')
      AND operation_no NOT LIKE 'message_push:%'
      AND operation_no NOT LIKE 'message_push_plan:%'
      AND (dispatch_count > 10 OR (status IN ('sending','unknown') AND updated_at < NOW() - INTERVAL '8 minutes'))
  ttl: 30
  timeout: 2
  tags: [ "dbname:railway" ]
  metrics:
    - datname: { usage: LABEL, description: database name }
    - loop_jobs: { usage: GAUGE, description: active Telegram jobs dispatched more than ten times }
    - max_dispatch_count: { usage: GAUGE, description: maximum dispatch count among abnormal active jobs }
    - stuck_jobs: { usage: GAUGE, description: sending or unknown jobs unchanged beyond the eight-minute recovery window }

youban_tg_message_push_health:
  name: youban_tg_message_push_health
  desc: Telegram message push jobs stuck beyond the recovery window
  predicate_queries:
    - name: tg job table exists
      predicate_query: |
        SELECT to_regclass('public.hg_youban_publish_tg_job') IS NOT NULL;
  query: |-
    SELECT current_database() AS datname,
           COUNT(*)::bigint AS stuck_jobs,
           COALESCE(EXTRACT(EPOCH FROM (NOW() - MIN(updated_at))), 0)::bigint AS oldest_stuck_age_seconds
    FROM hg_youban_publish_tg_job
    WHERE status IN ('sending','unknown')
      AND (operation_no LIKE 'message_push:%' OR operation_no LIKE 'message_push_plan:%')
      AND updated_at < NOW() - INTERVAL '8 minutes'
  ttl: 30
  timeout: 2
  tags: [ "dbname:railway" ]
  metrics:
    - datname: { usage: LABEL, description: database name }
    - stuck_jobs: { usage: GAUGE, description: message push jobs unchanged beyond the eight-minute recovery window }
    - oldest_stuck_age_seconds: { usage: GAUGE, description: age of the oldest stuck message push job }

youban_tg_progress:
  name: youban_tg_progress
  desc: Recent global Telegram publishing progress from a bounded task window
  predicate_queries:
    - name: tg job table exists
      predicate_query: |
        SELECT to_regclass('public.hg_youban_publish_tg_job') IS NOT NULL;
  query: |-
    SELECT current_database() AS datname,
           COALESCE(EXTRACT(EPOCH FROM (NOW() - MAX(sent_at))), 0)::bigint AS seconds_since_success
    FROM (
      SELECT sent_at
      FROM hg_youban_publish_tg_job
      ORDER BY id DESC
      LIMIT 10000
    ) recent
    WHERE sent_at IS NOT NULL
  ttl: 30
  timeout: 2
  tags: [ "dbname:railway" ]
  metrics:
    - datname: { usage: LABEL, description: database name }
    - seconds_since_success: { usage: GAUGE, description: seconds since last successful Telegram delivery in recent task window }

youban_tg_attempt_health:
  name: youban_tg_attempt_health
  desc: Expired Telegram delivery attempts waiting for timeout recovery
  predicate_queries:
    - name: tg attempt table exists
      predicate_query: |
        SELECT to_regclass('public.hg_youban_publish_tg_attempt') IS NOT NULL;
  query: |-
    SELECT current_database() AS datname,
           COUNT(*)::bigint AS expired_total,
           COALESCE(EXTRACT(EPOCH FROM (NOW() - MIN(webhook_deadline))), 0)::bigint AS oldest_expired_age_seconds
    FROM hg_youban_publish_tg_attempt
    WHERE status = 'awaiting_webhook'
      AND webhook_deadline < NOW() - INTERVAL '5 seconds'
  ttl: 30
  timeout: 2
  tags: [ "dbname:railway" ]
  metrics:
    - datname: { usage: LABEL, description: database name }
    - expired_total: { usage: GAUGE, description: expired attempts waiting for timeout recovery }
    - oldest_expired_age_seconds: { usage: GAUGE, description: age of the oldest expired attempt }

youban_tg_send_stage_detail:
  name: youban_tg_send_stage_detail
  desc: Individual Telegram delivery attempts stuck before or during webhook confirmation
  predicate_queries:
    - name: tg attempt and job tables exist
      predicate_query: |
        SELECT to_regclass('public.hg_youban_publish_tg_attempt') IS NOT NULL
           AND to_regclass('public.hg_youban_publish_tg_job') IS NOT NULL;
  query: |-
    SELECT current_database() AS datname,
           attempt.id::text AS attempt_id,
           job.id::text AS job_id,
           job.profile_id::text AS profile_id,
           job.channel_id::text AS channel_id,
           job.bot_id::text AS bot_id,
           attempt.phase,
           attempt.status,
           EXTRACT(EPOCH FROM (NOW() - attempt.updated_at))::bigint AS age_seconds,
           1::bigint AS active
    FROM hg_youban_publish_tg_attempt attempt
    JOIN hg_youban_publish_tg_job job ON job.id = attempt.job_id
    WHERE job.status IN ('sending','unknown')
      AND (
        (attempt.status = 'sending' AND attempt.updated_at < NOW() - INTERVAL '45 seconds')
        OR
        (attempt.status = 'awaiting_webhook' AND attempt.webhook_deadline < NOW() - INTERVAL '5 seconds')
      )
    ORDER BY attempt.updated_at
    LIMIT 100
  ttl: 30
  timeout: 2
  tags: [ "dbname:railway" ]
  metrics:
    - datname: { usage: LABEL, description: database name }
    - attempt_id: { usage: LABEL, description: delivery attempt id }
    - job_id: { usage: LABEL, description: publish job id }
    - profile_id: { usage: LABEL, description: profile id }
    - channel_id: { usage: LABEL, description: channel id }
    - bot_id: { usage: LABEL, description: bot id }
    - phase: { usage: LABEL, description: display or verify phase }
    - status: { usage: LABEL, description: attempt status }
    - age_seconds: { usage: GAUGE, description: seconds since attempt last changed }
    - active: { usage: GAUGE, description: one for each abnormal attempt }

youban_tg_duplicate_verify_detail:
  name: youban_tg_duplicate_verify_detail
  desc: Jobs with multiple live verification messages
  predicate_queries:
    - name: tg message table exists
      predicate_query: |
        SELECT to_regclass('public.hg_youban_publish_tg_message') IS NOT NULL;
  query: |-
    WITH recent AS MATERIALIZED (
      SELECT id,job_id,profile_id,bot_id,purpose,status,deleted_at
      FROM hg_youban_publish_tg_message
      ORDER BY id DESC
      LIMIT 10000
    ), counts AS (
      SELECT job_id,profile_id,bot_id,COUNT(*)::bigint AS message_count
      FROM recent
      WHERE purpose = 'verify' AND status = 'sent' AND deleted_at IS NULL
      GROUP BY job_id,profile_id,bot_id
      HAVING COUNT(*) > 1
    )
    SELECT current_database() AS datname,
           counts.job_id::text AS job_id,
           counts.profile_id::text AS profile_id,
           job.channel_id::text AS channel_id,
           counts.bot_id::text AS bot_id,
           counts.message_count,
           expected.expected_count
    FROM counts
    JOIN hg_youban_publish_tg_job job ON job.id = counts.job_id
    CROSS JOIN LATERAL (
      SELECT COUNT(*)::bigint AS expected_count
      FROM hg_youban_publish_media media
      WHERE media.profile_id = counts.profile_id
        AND media.purpose = 'verify'
        AND media.status = 1
        AND media.deleted_at IS NULL
    ) expected
    WHERE counts.message_count > GREATEST(expected.expected_count, 1)
    ORDER BY counts.message_count DESC
    LIMIT 100
  ttl: 30
  timeout: 2
  tags: [ "dbname:railway" ]
  metrics:
    - datname: { usage: LABEL, description: database name }
    - job_id: { usage: LABEL, description: publish job id }
    - profile_id: { usage: LABEL, description: profile id }
    - channel_id: { usage: LABEL, description: channel id }
    - bot_id: { usage: LABEL, description: bot id }
    - message_count: { usage: GAUGE, description: live verification messages for the job }
    - expected_count: { usage: GAUGE, description: verification media expected for the profile }
