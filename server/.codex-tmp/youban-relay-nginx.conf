events {}

http {
    access_log off;
    error_log /dev/stderr warn;

    upstream railway_api {
        server xiaohuiji-api-production.up.railway.app:443;
        keepalive 64;
    }

    server {
        listen 18080;
        client_max_body_size 100m;
        client_body_timeout 120s;

        location / {
            proxy_pass https://railway_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host xiaohuiji-api-production.up.railway.app;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_ssl_name xiaohuiji-api-production.up.railway.app;
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
