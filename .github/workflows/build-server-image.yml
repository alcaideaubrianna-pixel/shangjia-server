name: build-images

on:
  push:
    branches:
      - feat/railway-runtime-ci-split
      - ci/tencent-build-speed
    paths:
      - "server/**"
      - "web/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-server-image.yml"
      - "scripts/ci/tag-successful-build.sh"
      - "!server/**/*_test.go"
      - "!server/tools/**"
      - "!server/docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-server-image-${{ github.ref }}
  # New commits supersede old builds; deployments must use the immutable SHA tag.
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/feat/railway-runtime-ci-split' || github.ref == 'refs/heads/ci/tencent-build-speed'
    # Set BUILD_RUNNER to a dedicated Linux AMD64 runner label when available.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    outputs:
      short_sha: ${{ steps.image.outputs.short_sha }}
      server_image: ${{ steps.image.outputs.server }}
      tencent_image: ${{ steps.image.outputs.tencent }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        env:
          TENCENT_IMAGE: ${{ vars.TENCENT_IMAGE || 'sgccr.ccs.tencentyun.com/xiaohuiji-cc/xiaohuiji-package' }}
        run: |
          set -euo pipefail
          tencent_registry="${TENCENT_IMAGE%%/*}"
          tencent_repository="${TENCENT_IMAGE#*/}"
          if [[ "$TENCENT_IMAGE" != */* || "$TENCENT_IMAGE" == *://* || -z "$tencent_repository" || "$tencent_repository" == *:* || "$tencent_repository" == *@* ]]; then
            echo "::error::TENCENT_IMAGE must be registry/namespace/repository without a scheme, tag or digest"
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "server=ghcr.io/${owner}/youban-server" >> "$GITHUB_OUTPUT"
          echo "tencent_registry=$tencent_registry" >> "$GITHUB_OUTPUT"
          echo "tencent=$TENCENT_IMAGE" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_version=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHA layer cache does not persist RUN --mount=type=cache contents.
      # Restore the previous compile cache, inject it before building, and save
      # the updated mount in post steps (extraction runs before cache saving).
      - name: Restore Go compilation cache
        id: go_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/go-build-cache
          key: ${{ runner.os }}-go1.25-linux-amd64-${{ hashFiles('server/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go1.25-linux-amd64-${{ hashFiles('server/go.sum') }}-
            ${{ runner.os }}-go1.25-linux-amd64-

      - name: Inject and extract Go compilation cache
        uses: reproducible-containers/buildkit-cache-dance@4b2444fec0c0fb9dbf175a96c094720a692ef810 # v2.1.4
        with:
          cache-source: ${{ runner.temp }}/go-build-cache
          cache-target: /root/.cache/go-build
          scratch-dir: ${{ runner.temp }}/buildkit-cache-dance
          skip-extraction: ${{ steps.go_cache.outputs.cache-hit == 'true' }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Tencent Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.tencent_registry }}
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: Docker metadata
        id: server_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.server }}
          tags: |
            type=raw,value=last
            type=raw,value=${{ steps.image.outputs.short_sha }}

      - name: Build once and push to both registries in parallel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ steps.image.outputs.build_version }}
          # BuildKit runs exporters concurrently. Keep names on each exporter:
          # a global "tags" input would overwrite BOTH exporter name lists.
          outputs: |
            type=image,"name=${{ steps.image.outputs.server }}:last,${{ steps.image.outputs.server }}:${{ steps.image.outputs.short_sha }}",push=true
            type=image,"name=${{ steps.image.outputs.tencent }}:last,${{ steps.image.outputs.tencent }}:${{ steps.image.outputs.short_sha }}",push=true
          labels: ${{ steps.server_meta.outputs.labels }}
          cache-from: |
            type=gha,scope=server-tencent-linux-amd64
            type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server-tencent-linux-amd64

      - name: Tag successful build
        env:
          BUILD_VERSION: ${{ steps.image.outputs.build_version }}
        run: bash scripts/ci/tag-successful-build.sh

      - name: Image summary
        run: |
          echo "### Published server image" >> "$GITHUB_STEP_SUMMARY"
          echo 'Build / Git tag: ${{ steps.image.outputs.build_version }}' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.server_meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.image.outputs.tencent }}:${{ steps.image.outputs.short_sha }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram build success
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YOUBAN_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YOUBAN_TELEGRAM_CHAT_ID }}
          IMAGE: ${{ steps.image.outputs.server }}:${{ steps.image.outputs.short_sha }}
          BUILD_VERSION: ${{ steps.image.outputs.build_version }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "telegram secrets are not configured, skip"
            exit 0
          fi
          text=$(printf '✅ <b>youban-server 构建成功</b>\n版本：%s / %s\n镜像：<code>%s</code>\n仓库：%s' "$BUILD_VERSION" "${GITHUB_SHA::7}" "$IMAGE" "$GITHUB_REPOSITORY")
          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${text}" || echo "telegram notify failed"

      - name: Notify Telegram build failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YOUBAN_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YOUBAN_TELEGRAM_CHAT_ID }}
          IMAGE: ${{ steps.image.outputs.server }}:${{ steps.image.outputs.short_sha }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "telegram secrets are not configured, skip"
            exit 0
          fi
          text=$(printf '❌ <b>youban-server 构建失败</b>\n版本：%s / %s\n镜像：<code>%s</code>\n仓库：%s\n日志：https://github.com/%s/actions/runs/%s' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$IMAGE" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${text}" || echo "telegram notify failed"
