name: build-images

on:
  push:
    branches:
      - feat/railway-runtime-ci-split
    paths:
      - "server/**"
      - "web/**"
      - "deploy/**"
      - "docs/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/build-server-image.yml"
      - "scripts/ci/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-server-image-${{ github.ref }}
  # Keep builds for the same branch serialized.
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/feat/railway-runtime-ci-split'
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.image.outputs.short_sha }}
      server_image: ${{ steps.image.outputs.server }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "server=ghcr.io/${owner}/youban-server" >> "$GITHUB_OUTPUT"
          echo "tencent=sgccr.ccs.tencentyun.com/xxxx/xxxx" >> "$GITHUB_OUTPUT"
          echo "branch_tag=feat-railway-runtime-ci-split" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Tencent Container Registry
        uses: docker/login-action@v3
        with:
          registry: sgccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: Docker metadata
        id: server_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.server }}
          tags: |
            type=raw,value=${{ steps.image.outputs.branch_tag }}
            type=sha,prefix=sha-

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            GIT_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.server_meta.outputs.tags }}
            ${{ steps.image.outputs.tencent }}:latest
            ${{ steps.image.outputs.tencent }}:${{ steps.image.outputs.short_sha }}
          labels: ${{ steps.server_meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Image summary
        run: |
          echo "### Published server image" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.server_meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram build success
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YOUBAN_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YOUBAN_TELEGRAM_CHAT_ID }}
          IMAGE: ${{ steps.image.outputs.server }}:sha-${{ steps.image.outputs.short_sha }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "telegram secrets are not configured, skip"
            exit 0
          fi
          text=$(printf '✅ <b>youban-server 构建成功</b>\n版本：%s / %s\n镜像：<code>%s</code>\n仓库：%s' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$IMAGE" "$GITHUB_REPOSITORY")
          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${text}" || echo "telegram notify failed"

      - name: Notify Telegram build failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YOUBAN_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YOUBAN_TELEGRAM_CHAT_ID }}
          IMAGE: ${{ steps.image.outputs.server }}:sha-${{ steps.image.outputs.short_sha }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "telegram secrets are not configured, skip"
            exit 0
          fi
          text=$(printf '❌ <b>youban-server 构建失败</b>\n版本：%s / %s\n镜像：<code>%s</code>\n仓库：%s\n日志：https://github.com/%s/actions/runs/%s' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$IMAGE" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${text}" || echo "telegram notify failed"

  # SAE deployment is deliberately opt-in and currently limited to Web.  The
  # worker applications must not be restarted automatically until their
  # production DB/Redis cutover has been verified; running two publish
  # consumers during migration can duplicate Telegram messages.
  deploy-sae-web:
    name: Deploy Web to Alibaba Cloud SAE
    needs: build
    if: >-
      needs.build.result == 'success' &&
      vars.SAE_AUTO_DEPLOY == 'true' &&
      vars.SAE_WEB_APP_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
      ALIBABA_CLOUD_REGION_ID: ${{ vars.SAE_REGION_ID || 'ap-southeast-1' }}
      SAE_APP_ID: ${{ vars.SAE_WEB_APP_ID }}
      IMAGE_URL: ${{ needs.build.outputs.server_image }}:sha-${{ needs.build.outputs.short_sha }}
    steps:
      - name: Install Alibaba Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz \
            | tar -xz -C /tmp
          sudo install -m 0755 /tmp/aliyun /usr/local/bin/aliyun
          aliyun version

      - name: Deploy immutable image to SAE
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_ID"
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_SECRET"
          test -n "$SAE_APP_ID"
          aliyun configure set \
            --profile github-actions \
            --mode AK \
            --region "$ALIBABA_CLOUD_REGION_ID" \
            --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
            --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET"
          export ALIBABACLOUD_PROFILE=github-actions
          aliyun sae DeployApplication \
            --RegionId "$ALIBABA_CLOUD_REGION_ID" \
            --AppId "$SAE_APP_ID" \
            --ImageUrl "$IMAGE_URL"

      - name: Verify SAE Web health
        shell: bash
        env:
          HEALTH_URL: ${{ vars.SAE_WEB_HEALTH_URL }}
        run: |
          set -euo pipefail
          test -n "$HEALTH_URL"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" >/dev/null; then
              echo "SAE Web health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "SAE Web health check failed: $HEALTH_URL" >&2
          exit 1
