name: build-images

on:
  push:
    branches:
      - sj/develop
      - main
    tags:
      - "v*"
    paths:
      - "server/**"
      - "web/**"
      - "deploy/**"
      - "docs/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/build-server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "server=ghcr.io/${owner}/youban-server" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: server_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.server }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'sj/develop' || github.ref_name == github.event.repository.default_branch }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.server_meta.outputs.tags }}
          labels: ${{ steps.server_meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Image summary
        run: |
          echo "### Published server image" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.server_meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram build success
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YOUBAN_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YOUBAN_TELEGRAM_CHAT_ID }}
          IMAGE: ${{ steps.image.outputs.server }}:sha-${{ steps.image.outputs.short_sha }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "telegram secrets are not configured, skip"
            exit 0
          fi
          text=$(printf '✅ <b>youban-server 构建成功</b>\n版本：%s / %s\n镜像：<code>%s</code>\n仓库：%s' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$IMAGE" "$GITHUB_REPOSITORY")
          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${text}" || echo "telegram notify failed"

      - name: Notify Telegram build failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YOUBAN_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YOUBAN_TELEGRAM_CHAT_ID }}
          IMAGE: ${{ steps.image.outputs.server }}:sha-${{ steps.image.outputs.short_sha }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "telegram secrets are not configured, skip"
            exit 0
          fi
          text=$(printf '❌ <b>youban-server 构建失败</b>\n版本：%s / %s\n镜像：<code>%s</code>\n仓库：%s\n日志：https://github.com/%s/actions/runs/%s' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$IMAGE" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${text}" || echo "telegram notify failed"

      - name: Deploy server image
        if: ${{ github.ref_name == 'sj/develop' }}
        env:
          ONEPANEL_BASE_URL: ${{ secrets.ONEPANEL_BASE_URL }}
          ONEPANEL_API_KEY: ${{ secrets.ONEPANEL_API_KEY }}
          ONEPANEL_CONTAINER_NAME: ${{ secrets.ONEPANEL_CONTAINER_NAME }}
          IMAGE: ${{ steps.image.outputs.server }}:sha-${{ steps.image.outputs.short_sha }}
        run: |
          if [ -z "$ONEPANEL_BASE_URL" ] || [ -z "$ONEPANEL_API_KEY" ] || [ -z "$ONEPANEL_CONTAINER_NAME" ]; then
            echo "1Panel secrets are not configured, skip"
            exit 0
          fi

          timestamp="$(date +%s)"
          token="$(printf '1panel%s%s' "$ONEPANEL_API_KEY" "$timestamp" | md5sum | awk '{print $1}')"
          base_url="${ONEPANEL_BASE_URL%/}"
          body="$(jq -nc \
            --arg name "$ONEPANEL_CONTAINER_NAME" \
            --arg image "$IMAGE" \
            '{names: [$name], image: $image, forcePull: true}')"

          curl --fail --show-error --silent \
            -X POST "$base_url/api/v2/containers/upgrade" \
            -H "1Panel-Token: $token" \
            -H "1Panel-Timestamp: $timestamp" \
            -H "Content-Type: application/json" \
            --data "$body"
