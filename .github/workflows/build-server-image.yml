name: build-images

on:
  push:
    branches:
      - sj/develop
      - main
      - "feat/**"
    tags:
      - "v*"
    paths:
      - "server/**"
      - "web/**"
      - "deploy/**"
      - "docs/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/build-server-image.yml"
      - ".github/actions/cleanup-tencent-tags/**"
      - "scripts/ci/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "server=ghcr.io/${owner}/youban-server" >> "$GITHUB_OUTPUT"
          echo "collector=ghcr.io/${owner}/youban-server" >> "$GITHUB_OUTPUT"
          echo "tencent_registry=hkccr.ccs.tencentyun.com" >> "$GITHUB_OUTPUT"
          echo "tencent_repo=testaaaaa/dwadfwaf" >> "$GITHUB_OUTPUT"
          echo "tencent=hkccr.ccs.tencentyun.com/testaaaaa/dwadfwaf" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Tencent Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: hkccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Docker metadata
        id: server_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.image.outputs.server }}
            ${{ steps.image.outputs.tencent }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'sj/develop' || github.ref_name == github.event.repository.default_branch }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Collector Docker metadata
        id: collector_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.collector }}
          tags: |
            type=raw,value=otel-latest,enable=${{ github.ref_name == 'sj/develop' || github.ref_name == github.event.repository.default_branch }}
            type=ref,event=branch,prefix=otel-
            type=ref,event=tag,prefix=otel-
            type=sha,prefix=otel-sha-

      - name: Reserve Tencent registry tag capacity
        if: ${{ success() }}
        uses: ./.github/actions/cleanup-tencent-tags
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TCR_REGION: ${{ vars.TCR_REGION || 'ap-hongkong' }}
          TCR_REPO_NAME: ${{ steps.image.outputs.tencent_repo }}
          # 每次构建最多新增 branch/tag 与 sha 两个新标签，预留 2 个名额后总数不超过 20。
          TCR_KEEP_TAGS: "18"

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.server_meta.outputs.tags }}
          labels: ${{ steps.server_meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push collector image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/observability/collector/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.collector_meta.outputs.tags }}
          labels: ${{ steps.collector_meta.outputs.labels }}
          cache-from: type=gha,scope=collector
          cache-to: type=gha,mode=max,scope=collector

      - name: Image summary
        run: |
          echo "### Published server image" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.server_meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"
          echo "### Published collector image" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.collector_meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram build success
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YOUBAN_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YOUBAN_TELEGRAM_CHAT_ID }}
          IMAGE: ${{ steps.image.outputs.tencent }}:sha-${{ steps.image.outputs.short_sha }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "telegram secrets are not configured, skip"
            exit 0
          fi
          text=$(printf '✅ <b>youban-server 构建成功</b>\n版本：%s / %s\n镜像：<code>%s</code>\n仓库：%s' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$IMAGE" "$GITHUB_REPOSITORY")
          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${text}" || echo "telegram notify failed"

      - name: Notify Telegram build failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YOUBAN_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YOUBAN_TELEGRAM_CHAT_ID }}
          IMAGE: ${{ steps.image.outputs.tencent }}:sha-${{ steps.image.outputs.short_sha }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "telegram secrets are not configured, skip"
            exit 0
          fi
          text=$(printf '❌ <b>youban-server 构建失败</b>\n版本：%s / %s\n镜像：<code>%s</code>\n仓库：%s\n日志：https://github.com/%s/actions/runs/%s' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$IMAGE" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${text}" || echo "telegram notify failed"
