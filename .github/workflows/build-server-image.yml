name: build-images

on:
  push:
    branches:
      - develop
      - main
      - v2.0
      - web
    tags:
      - "v*"
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/build-server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "server=ghcr.io/${owner}/youban-server" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build admin web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Copy admin web into server resources
        run: |
          rm -rf server/resource/public/admin
          mkdir -p server/resource/public/admin
          cp -R web/dist/. server/resource/public/admin/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"
          cache-dependency-path: server/go.sum

      - name: Install GoFrame CLI
        run: go install github.com/gogf/gf/cmd/gf/v2@v2.10.0

      - name: Test youban chat addon
        working-directory: server
        run: go test ./addons/youban_chat/...

      - name: Pack server resources
        working-directory: server
        run: |
          rm -f internal/packed/packed.go
          gf pack resource,storage internal/packed/packed.go --keepPath=true

      - name: Build Linux binary
        working-directory: server
        run: |
          mkdir -p temp/linux_amd64
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -o temp/linux_amd64/hotgo ./main.go
          chmod +x temp/linux_amd64/hotgo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: server_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.server }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'develop' || github.ref_name == github.event.repository.default_branch }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/manifest/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.server_meta.outputs.tags }}
          labels: ${{ steps.server_meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Image summary
        run: |
          echo "### Published server image" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.server_meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram build success
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YOUBAN_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YOUBAN_TELEGRAM_CHAT_ID }}
          IMAGE: ${{ steps.image.outputs.server }}:sha-${{ steps.image.outputs.short_sha }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "telegram secrets are not configured, skip"
            exit 0
          fi
          text=$(cat <<EOF
✅ <b>youban-server 构建成功</b>
版本：${GITHUB_REF_NAME} / ${GITHUB_SHA::7}
镜像：<code>${IMAGE}</code>
仓库：${GITHUB_REPOSITORY}
EOF
)
          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${text}" || echo "telegram notify failed"

      - name: Notify Telegram build failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YOUBAN_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YOUBAN_TELEGRAM_CHAT_ID }}
          IMAGE: ${{ steps.image.outputs.server }}:sha-${{ steps.image.outputs.short_sha }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "telegram secrets are not configured, skip"
            exit 0
          fi
          text=$(cat <<EOF
❌ <b>youban-server 构建失败</b>
版本：${GITHUB_REF_NAME} / ${GITHUB_SHA::7}
镜像：<code>${IMAGE}</code>
仓库：${GITHUB_REPOSITORY}
日志：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
EOF
)
          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${text}" || echo "telegram notify failed"

      - name: Deploy server image
        if: ${{ github.ref_name == 'develop' }}
        env:
          DEPLOY_URL: ${{ secrets.YOUBAN_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.YOUBAN_DEPLOY_TOKEN }}
          IMAGE: ${{ steps.image.outputs.server }}:sha-${{ steps.image.outputs.short_sha }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "deploy webhook secrets are not configured, skip"
            exit 0
          fi
          curl --fail --show-error --silent \
            -X POST "$DEPLOY_URL" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"image\":\"$IMAGE\"}"
